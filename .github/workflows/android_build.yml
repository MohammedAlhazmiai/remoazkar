name: Build Android Release APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Decode Keystore
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        if [ -n "$KEYSTORE_BASE64" ]; then
          echo "$KEYSTORE_BASE64" | base64 --decode > my-upload-key.jks
        elif [ -f "keystore_base64.txt" ]; then
          base64 --decode keystore_base64.txt > my-upload-key.jks
        fi

    - name: Build Release APK with Gradle
      env:
        STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'android' }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'android' }}
        KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
      run: |
        chmod +x gradlew
        ./gradlew assembleRelease --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: release-apk
        path: app/build/outputs/apk/release/*.apk
