name: Publish Android APK Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Verify tag matches app version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          APP_VERSION="$(python3 - <<'PY'
          import re
          from pathlib import Path

          text = Path('app/build.gradle.kts').read_text(encoding='utf-8')
          match = re.search(r'versionName\s*=\s*"([0-9]+(?:\.[0-9]+)*)"', text)
          if not match:
              raise SystemExit('Could not read a numeric versionName from app/build.gradle.kts')
          print(match.group(1))
          PY
          )"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$TAG_VERSION" != "$APP_VERSION" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match app version $APP_VERSION" >&2
            exit 1
          fi
          echo "app_version=$APP_VERSION" >> "$GITHUB_OUTPUT"
          echo "apk_name=zad-almuslim-${GITHUB_REF_NAME}.apk" >> "$GITHUB_OUTPUT"

      - name: Decode release keystore from GitHub Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_PATH: ${{ runner.temp }}/zad-almuslim-upload-key.jks
        shell: bash
        run: |
          set -euo pipefail
          : "${KEYSTORE_BASE64:?Required GitHub Actions secret KEYSTORE_BASE64 is missing}"
          : "${STORE_PASSWORD:?Required GitHub Actions secret STORE_PASSWORD is missing}"
          : "${KEY_PASSWORD:?Required GitHub Actions secret KEY_PASSWORD is missing}"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"

      - name: Build signed release APK
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_PATH: ${{ runner.temp }}/zad-almuslim-upload-key.jks
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease --stacktrace
          APK_SOURCE="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$APK_SOURCE"
          mkdir -p "$RUNNER_TEMP/release-assets"
          cp "$APK_SOURCE" "$RUNNER_TEMP/release-assets/${{ steps.version.outputs.apk_name }}"

      - name: Publish APK as a GitHub Release asset
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          APP_VERSION: ${{ steps.version.outputs.app_version }}
          APK_PATH: ${{ runner.temp }}/release-assets/${{ steps.version.outputs.apk_name }}
        shell: bash
        run: |
          set -euo pipefail
          TITLE="زاد المسلم ${APP_VERSION}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets \
              --jq '.assets[].name' | grep -Fxq "$(basename "$APK_PATH")"; then
              echo "Release $TAG already contains $(basename "$APK_PATH"); leaving the published asset unchanged."
              exit 0
            fi
            gh release upload "$TAG" "$APK_PATH" --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$APK_PATH" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TITLE" \
              --generate-notes \
              --verify-tag
          fi
